[project]
name = "findex"
version = "0.6.0"
description = "A small search engine over a Project Gutenberg corpus, built lab by lab."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "daideneg28-prog" }]
keywords = ["search-engine", "inverted-index", "bm25", "information-retrieval"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.120",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pydantic-settings>=2.11",
    "rich>=15.0.0",
    "typer>=0.29.1",
    "uvicorn>=0.38",
]

[project.urls]
Repository = "https://github.com/daideneg28-prog/findex"

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.15",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:hypothesispytest: the optional reporting plugin imports Hypothesis' native extension
# at startup, which Windows Smart App Control blocks on the author's laptop; @given works without it.
addopts = "-ra --strict-markers -p no:hypothesispytest"
markers = ["slow: takes more than a second (deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["findex"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
