name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (pyright strict)
        run: uv run pyright

      - name: Tests (pytest + Hypothesis + coverage)
        run: uv run pytest --cov --cov-report=term-missing

      - name: Build wheel and install it as a tool
        run: |
          uv build
          uv tool install dist/*.whl
          findex --help
          findex --version
