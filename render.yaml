# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: findex
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
